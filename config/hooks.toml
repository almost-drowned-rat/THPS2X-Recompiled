# Save overwrite from OPTIONS -> MEMORY UNIT -> SAVE GAME (maintainer, 2026-11-07;
# a bug of the original too, checked on xemu): the save step sub_00110560
# branches on the screen's mode at 0x00110735 (eax = [screen+0x15E24]: 1 new,
# 3 overwrite). From the options menu the screen is built in mode 1 even when
# the player picked an existing save and confirmed the game's own "Are you sure
# you want to overwrite this save game?", so keeping the name ended in "A file
# named [%s] already exists". See thps_save_overwrite_mode in recomp_manual.c.
[[hook]]
at = 0x00110735
call = "thps_save_overwrite_mode"

# Ollie charge at 120 fps (maintainer, 2026-11-07): HandleJump sub_000AEA90
# counts the charge (skater+0x5694, 0x000AEFBC) only when the 60 Hz vblank
# counter byte [0x30697C] is odd (test at 0x000AEFB3, je 0x000AEFC2). At 120
# fps two game frames see the same odd value, so the charge filled twice as
# fast. The hook replaces the test: nonzero = count, zero = skip. See
# thps_ollie_charge_tick in recomp_manual.c.
[[hook]]
at = 0x000AEFB3
call = "thps_ollie_charge_tick"
on_true = 0x000AEFBC
on_false = 0x000AEFC2

# Traffic cars at 120 fps (Discord report, 2026-11-14): CCar::AI sub_00072B60
# brakes the car's velocity by 1/16 per game frame in the last 1/16 of a road
# segment (block 0x00072E24 .. 0x00072E5E), not per level step - at 120 fps the
# taxis crawled through the corners. Nonzero = the block was done per step in
# C (not at 60 fps), zero = the game's block runs. See thps_car_brake in
# recomp_manual.c.
[[hook]]
at = 0x00072E24
call = "thps_car_brake"
on_true = 0x00072E5E

# Loop bail at 120 fps (Discord report, 2026-11-14): upside down, the skater
# bails when skater+0x59FC (game frames since the rotation changed) is above
# 6 - at 120 fps a loop polygon takes twice as many frames. The hook counts in
# 60 Hz frames: nonzero = no bail (0x000B1D3A), zero = the game's bail block.
# See thps_loop_bail in recomp_manual.c.
[[hook]]
at = 0x000B1C30
call = "thps_loop_bail"
on_true = 0x000B1D3A

# Object script waits at 120 fps (Discord report, 2026-11-14): C_WAIT counts
# object+0x1DC down by 1 per game frame; the ambient sound loops (play, wait,
# goto) ran twice as fast. The hooks count it in 60 Hz frames of the step
# clock: nonzero = done (after the decrement), zero = the game's decrement.
# The object is edi at the first, sub_000B76D0's this at the second. See
# thps_script_wait in recomp_manual.c.
[[hook]]
at = 0x0006AA14
call = "thps_script_wait_edi"
on_true = 0x0006AA34

[[hook]]
at = 0x000B77A1
call = "thps_script_wait_this"
on_true = 0x000B77B8

# Rail bends (GitHub #21, v1.2.8): both on-rail routines test a segment's end
# with the full Speed (one PS1 30 fps step) but move by Speed x [0x300850] >> 8
# (half of it at 60 fps), so every node of a multi-segment rail gave a jump.
# At "add edi, ecx" (no flag live before it) the step becomes the real
# distance; at the move of a pass after a node only the rest is moved
# (on_true: after the game's move). See thps_rail_step in recomp_manual.c.
[[hook]]
at = 0x000A971B
call = "thps_rail_step"

[[hook]]
at = 0x000A9A28
call = "thps_rail_move"
on_true = 0x000A9AAE

[[hook]]
at = 0x000B56FD
call = "thps_rail_step"

[[hook]]
at = 0x000B5A04
call = "thps_rail_move"
on_true = 0x000B5A8A
