# THPS 2X instruction hooks (toolkit tools/recomp/hooks_config.py, design after
# XboxXBE-Recomp's [[hook]], MIT). Read by tools\lift.ps1 (--hooks); a change
# here needs a re-lift. Each hook is a C function in src/ (recomp_manual.c):
# void name(void), or int name(void) with on_true / on_false.
#
# [[hook]]
# at = 0x0012ABCD        # guest instruction inside a recompiled function
# call = "thps_fix"      # the C function
# after = false          # true: after the instruction (not after a jump or ret)
# on_true = "ret"        # returned nonzero: return as the function's ret does
# on_false = 0x0012AC00  # returned zero: go to that instruction of the function
#
# The hook sees the guest registers (g_eax ... g_esp) and memory, not the flags
# the lifter keeps lazily: place it where no flag is live.

# Self-test of the mechanism (M3.5 step 3): counts the main-menu Multiplayer
# check (0x001238B0, first instruction). RECOMP_HOOK_TRACE=1 logs the count.
[[hook]]
at = 0x001238B0
call = "thps_hook_mp_check"

# D3D 3947 write-combine flush acknowledge (M3.5): CDevice_KickOff (0x00019E90)
# and its sibling 0x00019DC0 set bit 16 of NV2A 0x00100410 and spin until the
# GPU clears it. Clearing it right before the test -- recomp_spin_wake(), the
# runtime's flush acknowledge -- ends the spin at once, instead of waiting for
# a register thread to poll it (with those threads no longer spinning, boot
# took minutes: thousands of kickoffs).
[[hook]]
at = 0x00019DE0
call = "recomp_spin_wake"

[[hook]]
at = 0x00019ED0
call = "recomp_spin_wake"

# Movie loop pacing (M5 hardening, point 6). The Bink loop sub_001B05E0 asks
# BinkWait (sub_001C00A0) whether the next frame is due; while it is not it
# polls the pads (0x001B0E70) and asks again -- a spin, ~236,000 polls a
# second on one core. 0x001B073F is the pad-poll call every pass of the loop
# goes through (after a decoded frame and on the "not due" path); the hook
# lets at most one pass per guest vblank through and sleeps until the next
# vblank otherwise, so the pads are still read every vblank and a skip press
# is seen within 16.7 ms, as before.
[[hook]]
at = 0x001B073F
call = "thps_movie_wait"

# Watch Replay tick field (2026-10-17): the recorder stores the vblanks per
# frame as dt - 2 in 2 bits and playback holds each frame that long (2..5
# vblanks, made for 30 fps); at 60 fps dt = 1 overflowed and replays ran at
# ~11 fps. Both ends move the bias to 1 (1..4 vblanks). recomp_manual.c says
# more. The flags of both adds are dead: a cmp / add follows.
[[hook]]
at = 0x000D2582
call = "thps_replay_tick_rec"
after = true

[[hook]]
at = 0x000D65C5
call = "thps_replay_tick_play"
after = true

# Options menu (M6 groundwork, recomp_manual.c): 0x0013D323 pushes the number
# of lines the Options menu navigates (12); the hook sets it for the rewritten
# list (10 main, 4 CONTROLS). push: no flags involved.
[[hook]]
at = 0x0013D323
call = "thps_opt_line_count"
after = true
