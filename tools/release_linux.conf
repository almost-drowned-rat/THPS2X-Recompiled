# release_linux.conf - THPS 2X's names for the toolkit's tools/release/port_release_linux.sh (sourced; its header
# lists every key). The Linux twin of tools/release.psd1 (2026-11-24, THPS 2.0 Linux).
#
# Layout (folder paths without spaces): <W>/src = this repo (worktree), <W>/toolkit = option-c, <W>/gen -> the lift's
# generated C (tools/lift.txt's {GEN}; a link to private/thps2x/gen is fine), RELEASE_BUILD = the release build made
# with the toolkit's cmake/linux-sysroot.cmake (glibc 2.35 sysroot, libc++ static) and -DXR_DEBUG_PANEL=OFF.
#
#   RELEASE_BUILD=<W>/private/build_rel bash <W>/toolkit/tools/release/port_release_linux.sh \
#       <W>/src/tools/release_linux.conf <version> <bundle with llvm/ + python/> [--dev]
#   then tools/release_linux_tar.sh for the .tar.gz of the same folder.
_here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
W="$(cd "$_here/../.." && pwd)"
SLUG=thps2x-recomp                     # the launcher's file name + share/<slug>
TARGET=thps2x_recomp                   # the CMake target
GAME=THPS2X                            # the game exe of the release build (the player's launcher builds data/thps2x)
TITLE="THPS 2X Recomp"
APPIMAGE=THPS2X_Recompiled             # <APPIMAGE>-<version>-x86_64.AppImage
LICENCE=LICENSE-THPS2X-recomp-GPL-3.0.txt
PUBLIC_REPO=THPS2X-Recompiled
DATA=""
DEPS="$W/private/deps_appimage"        # appimagetool/ (1.9.1, extracted) + appimage_runtime/runtime-x86_64
ICON=assets/icon_256.png
LIFT_FILE=tools/lift.txt
LIFTER_FILES="port/hooks.toml=config/hooks.toml port/seeds=seeds/*_seeds.json"
RECOMPLAUNCHER_JSON=recomplauncher.json
# the LGPL source bundle from a clone of the public toolkit xboxrecomp-option-c at the release tag
PUBLIC_TOOLKIT="${PUBLIC_TOOLKIT:-}"
PUBLIC_TAG=thps2x-v2.0.1
